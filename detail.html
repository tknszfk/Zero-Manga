<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.add("light-mode")}catch(e){}</script>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <title>รายละเอียดมังงะ - Zero-Manga</title>
</head>
<body>
    <header>
        <a class="logo" href="index.html"><img src="logo.png" alt="" class="logo-img" height="32" style="height:32px;width:auto"> Zero-Manga</a>
        <nav><a href="index.html">หน้าแรก</a>
            <a href="all.html">มังงะทั้งหมด</a>
            <a href="my.html?tab=library">คลังของฉัน</a></nav>
        <div class="header-right">
            <button id="toggleMode" class="mode-btn" type="button">☀️ โหมดกลางวัน</button>
        </div>
    </header>

    <main class="detail-container" id="detailRoot">
        <div class="detail-content">
            <img id="comicCover" src="" alt="ปกมังงะ" class="comic-cover" referrerpolicy="no-referrer">
            <div class="comic-info">
                <h1 id="comicTitle">กำลังโหลด...</h1>
                <p id="comicSynopsis"></p>
                <div class="info-tags">
                    <p><strong>Rating:</strong> ⭐ <span id="comicRating">-</span>/10</p>
                    <p><strong>Status:</strong> <span id="comicStatus">-</span></p>
                    <p><strong>Type:</strong> <span id="comicType">-</span></p>
                </div>
                <div id="comicGenres" class="genres"></div>
                <div class="read-buttons">
                    <a id="readFirst" class="read-btn" href="#">อ่านตอนที่ 1</a>
                    <a id="readLatest" class="read-btn" href="#">อ่านตอนล่าสุด</a>
                </div>
            </div>
        </div>
        <h2 style="margin-top:40px;">📚 รายการตอน</h2>
        <div id="chapterList" class="chapter-list"></div>
    </main>

    <footer><p>© 2026 Zero-Manga | เว็บอ่านการ์ตูนออนไลน์</p></footer>

    <script src="data.js"></script>
    <script src="common.js"></script>
    <script src="detail.js"></script>
</body>
</html>
